# wstunnel-Server: Zugriffsregeln (wird bei Aenderung automatisch neu geladen).
# Vorlage: Platzhalter im PathPrefix durch das Secret ersetzen, als restrictions.yaml speichern.
#
# Wirkung:
#  - Nur Clients mit dem geheimen Pfad-Praefix werden akzeptiert.
#  - Nur Forward-Tunnel (keine Reverse-Tunnel), nur TCP, nur Ziel-Port 80/443.
#  - Hostnamen: mindestens ein Punkt, TLD aus Buchstaben, nie *.localhost.
#    Lokale Namen (pi.hole, *.home, Container-Namen) loest der Server nicht auf,
#    weil er per --dns-resolver nur oeffentliches DNS fragt (siehe docker-compose.yml).
#  - IP-Adressen als Ziel: nur oeffentliche IPv4-Bereiche (privat, Loopback,
#    Link-Local, CGNAT, Multicast ausgeschlossen) und globales IPv6.
restrictions:
  - name: "tunnler"
    description: "Forward-Tunnel mit Secret, TCP 80/443, keine privaten Ziele"
    match:
      - !PathPrefix "^__SECRET__$"
    allow:
      - !Tunnel
        protocol:
          - Tcp
        port:
          - 80
          - 443
        host: '(?i)^([a-z0-9_-]+\.)+([a-z]{2,8}|[a-z]{10,63}|[a-km-z][a-z]{8}|l[a-np-z][a-z]{7}|lo[a-bd-z][a-z]{6}|loc[b-z][a-z]{5}|loca[a-km-z][a-z]{4}|local[a-gi-z][a-z]{3}|localh[a-np-z][a-z]{2}|localho[a-rt-z][a-z]|localhos[a-su-z]|xn--[a-z0-9-]+)$'
        cidr:
          - 1.0.0.0/8
